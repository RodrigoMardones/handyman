name: CI

on:
  push:
    # main + feature branches: CI (and the Snyk scan) runs on the branch
    # under test even before a PR exists.
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # The repo is a pnpm workspace (packages/toolbox-core since feature
        # 42; apps/web was removed 2026-07-28 — the panel is Mastra Studio):
        # handyman consumes @handyman/toolbox-core via workspace:*, which npm
        # ci cannot resolve. pnpm/action-setup reads the pinned version from
        # the root package.json packageManager field.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        # The Handyman toolchain and test suite are single-track Node: the
        # CLIs ship as TypeScript compiled to handyman/dist/ (gitignored) and
        # the suite runs them as node dist/*.js. Dependencies come from the
        # pnpm workspace install below. Node 22+ is required by pnpm 11.14
        # (uses the node:sqlite builtin), not by the toolchain itself.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        # npm run build == tsc -b: builds packages/toolbox-core (project
        # reference) first, then handyman/dist/.
        working-directory: handyman
        run: npm run build

      - name: Run test suite
        run: bash tests/run_tests.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint shell scripts
        # Scope mirrors init.sh's run_lint exactly: init.sh + tests/ +
        # handyman/scripts/. assets/*.template.sh is intentionally excluded
        # (placeholder syntax filled in at scaffold time).
        run: |
          shellcheck --version
          find init.sh tests handyman/scripts -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning

  snyk-agent-scan:
    name: Snyk agent scan (advisory)
    runs-on: ubuntu-latest
    # Advisory only — never gate merges on this job:
    # - The scanner's CLI output (issue codes, severities) is experimental and
    #   its analysis API has returned transient 503s (observed 2026-07-26).
    # - Two design-level false positives are expected on this repo: W008 (the
    #   SHA-256 integrity hashes in handyman/skills-lock.json) and W012 (the
    #   project's own pinned CLI, `npx handyman-harness@3`). Background:
    #   docs/archive/analisis-snyk-w011.md.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scan the exact branch head under test (the PR head SHA on
          # pull_request events), never the base; falls back to the event
          # SHA on push triggers.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv
        # setup-uv publishes full-version tags only (no floating v9 major tag).
        uses: astral-sh/setup-uv@v9.0.0

      - name: Scan the handyman skill
        # Scans the skill the same way skills.sh does on publish. Needs the
        # SNYK_TOKEN Actions secret (a free Snyk account token suffices);
        # skipped quietly on fork PRs, where secrets are not available.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::SNYK_TOKEN not available (fork PR or missing secret) — skipping Snyk scan"
            exit 0
          fi
          uvx snyk-agent-scan@latest handyman/SKILL.md

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Publishes handyman-harness only after a push lands on main and the test
    # suite is green; shellcheck/snyk stay out of the gate (snyk is advisory).
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      # A second push to main must not cancel an in-flight publish.
      group: publish-npm-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        # registry-url makes setup-node write the npmrc entry that
        # NODE_AUTH_TOKEN fills at publish time.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, pack and publish
        # Mirrors the manual flow exactly: tsc -b, pack_npm.mjs staging, then
        # npm publish from handyman/.pack-staging/. Publishing a version that
        # already exists on npm would 403, so a main merge without a version
        # bump (package.json == SKILL.md, enforced by the pack script) skips
        # instead of failing.
        working-directory: handyman
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "handyman-harness@$VERSION" version >/dev/null 2>&1; then
            echo "handyman-harness@$VERSION already on npm — nothing to publish"
            exit 0
          fi
          npm run build
          node scripts/pack_npm.mjs
          cd .pack-staging
          npm publish --access public
