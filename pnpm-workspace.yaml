packages:
  - "agents/*"
  - "apps/*"
  - "handyman"
  - "packages/*"
allowBuilds:
  # sharp is next/image's optional native optimizer; unused (zero pages,
  # no next/image in this scaffold) so its postinstall build is declined.
  sharp: false
  # esbuild's postinstall validates the platform binary that arrives via
  # optionalDependencies; approved so the npm-pack staging build (feature 64)
  # runs the same locally and in CI.
  esbuild: true
minimumReleaseAgeExclude:
  - '@types/node@26.1.2'
  - '@ai-sdk/anthropic@4.0.23'
  - '@ai-sdk/provider-utils@5.0.14'
  - '@ai-sdk/provider@4.0.4'
  - '@mastra/core@1.53.0'
  - '@mastra/libsql@1.17.1'
